<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ใช้ Laksaman (TLWG) แทน TH Sarabun เมื่อไม่มีฟอนต์ตัวจริงในเครื่อง — ความกว้างตัวอักษรเท่ากัน -->
<fontconfig>
  <alias binding="same"><family>TH SarabunPSK</family><accept><family>TH Sarabun New</family><family>Laksaman</family></accept></alias>
  <alias binding="same"><family>TH Sarabun New</family><accept><family>Laksaman</family></accept></alias>
</fontconfig>
