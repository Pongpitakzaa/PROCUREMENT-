name: Docker Build

# build image ของชุดติดตั้ง (deploy/) ในทุก PR แล้วเปิดระบบจริงบน runner เพื่อตรวจว่า image ใช้งานได้
# ขั้นตอนทดสอบอยู่ใน deploy/ci-smoke.sh — รันในเครื่องได้เหมือนกันทุกประการ
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # cache แยกตาม image: layer ของ LibreOffice/ฟอนต์ไม่ต้อง build ใหม่ถ้า Dockerfile ส่วนนั้นไม่เปลี่ยน
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          tags: procurement-api:latest
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: procurement-web:latest
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image sizes
        run: |
          {
            echo "### Docker images"
            echo
            echo "| image | size |"
            echo "|---|---|"
            docker image ls --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' 'procurement-*'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (install.sh → check.sh → CLI → HTTPS login → backup)
        run: sudo --preserve-env=GITHUB_ACTIONS deploy/ci-smoke.sh

      - name: Container logs on failure
        if: failure()
        working-directory: deploy
        run: sudo docker compose logs --no-color --tail 200

      - name: Stop containers
        if: always()
        working-directory: deploy
        run: sudo docker compose down || true
